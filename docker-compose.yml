services:
  jekyll:
    image: amirpourmand/al-folio:v0.14.2
    working_dir: /srv/jekyll
    command: bash -lc "bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development

volumes:
  bundle_cache:
